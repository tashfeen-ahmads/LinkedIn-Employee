name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: package.json's packageManager field is
      # the single source of truth, and naming a version in both places is an
      # error rather than a redundancy.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build first: the packages compile to dist/, and the apps typecheck
      # against those outputs rather than against source.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - run: pnpm typecheck

      - run: pnpm test

      # Proves the safety tests actually bite. A green suite says nothing on its
      # own: a test can pass because the code is right, or because it never
      # reaches the code.
      - name: Mutation check on the safety rules
        run: node scripts/mutation-check.mjs

      # The eval dataset's own consistency checks run here. The eval itself
      # needs an API key and is run deliberately, not on every push.
      - name: Check migration is applied in one piece
        run: |
          test -f packages/db/supabase/migrations/0001_init.sql
          grep -q "enable row level security" packages/db/supabase/migrations/0001_init.sql
