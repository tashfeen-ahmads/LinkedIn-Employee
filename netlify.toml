# At the repository root on purpose: this is where Netlify looks when a repo is
# imported from Git, so importing needs no settings typed into the UI. The base
# directory below is what points it at the web app.
#
# Netlify deploys the web app only. The worker is a long-running process with
# queues and schedulers, so it does not belong on a serverless host — see
# apps/worker/Dockerfile and docs/07-deployment.md.

[build]
  base = "apps/web"
  command = "cd ../.. && pnpm install --frozen-lockfile && pnpm build --filter @le/web..."
  # Relative to base, which is apps/web.
  publish = ".next"

  # Without this, Netlify applies its default rule for a site with a base
  # directory: skip the build unless something under `apps/web` changed. In this
  # repo that is wrong — the web app imports @le/db and @le/shared, so a change
  # in packages/ changes the site — and it fails silently. The push is accepted,
  # no build appears, and the site keeps serving an older commit with nothing
  # anywhere saying why. It skipped ten consecutive pushes before anyone noticed.
  #
  # Exit 0 means skip. So: build whenever the web app, any package it compiles
  # against, the lockfile, or this file itself moved; skip a worker-only or
  # docs-only push, which genuinely cannot change what is served.
  ignore = "cd ../.. && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/web packages pnpm-lock.yaml netlify.toml"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
